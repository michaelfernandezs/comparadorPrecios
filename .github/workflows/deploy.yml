name: Deploy PriceHunter Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  # Permite dispararlo manualmente desde la pestaña Actions
  workflow_dispatch:

env:
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pricehunter-repo/api:${{ github.sha }}
  IMAGE_LATEST: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pricehunter-repo/api:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Construir imagen Docker
        working-directory: ./backend
        run: |
          docker build -t ${{ env.IMAGE }} -t ${{ env.IMAGE_LATEST }} .

      - name: Subir imagen a Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}
          docker push ${{ env.IMAGE_LATEST }}

      - name: Desplegar servicio API en Cloud Run
        run: |
          gcloud run services update pricehunter-api \
            --region=${{ secrets.GCP_REGION }} \
            --image=${{ env.IMAGE }}

      - name: Actualizar Cloud Run Job con la nueva imagen
        run: |
          gcloud run jobs update pricehunter-scraper-job \
            --region=${{ secrets.GCP_REGION }} \
            --image=${{ env.IMAGE }}
